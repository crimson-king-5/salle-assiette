<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16202B">
  <title>Salle & Assiette</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Figtree:wght@400;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="today">
    <header>
      <p class="date" id="date"></p>
      <h1>Salut Karim</h1>
    </header>

    <!-- A workout was left in progress: offer to resume it -->
    <section id="resume" class="card hero" data-level="vert" hidden>
      <p class="level">⏸ Séance en cours</p>
      <h2 id="resume-name"></h2>
      <button type="button" id="resume-btn" class="primary">Reprendre</button>
    </section>

    <!-- Morning check-in: 4 emoji questions + available time -->
    <section id="checkin" class="card" hidden>
      <h2>Check-in du jour</h2>
      <p class="muted">5 taps, et je t'adapte la séance.</p>
      <div id="questions"></div>
      <div class="question">
        <p class="label">Temps dispo</p>
        <div class="choices" data-field="minutes">
          <button type="button" data-value="30">30 min</button>
          <button type="button" data-value="45">45 min</button>
          <button type="button" data-value="60">60+ min</button>
        </div>
      </div>
      <button type="button" id="submit" class="primary" disabled>Valider</button>
    </section>

    <!-- Hero card: traffic light + today's session -->
    <section id="result" class="card hero" hidden>
      <p class="level" id="level"></p>
      <h2 id="format"></h2>
      <p class="label">Séance</p>
      <div class="sessions" id="sessions"></div>
      <ol class="exercises" id="exercises"></ol>
      <button type="button" id="start" class="primary">Commencer</button>
      <button type="button" id="redo" class="ghost">Refaire le check-in</button>
    </section>

    <p id="error" class="error" role="alert" hidden></p>
  </main>

  <!-- Workout mode: full screen, one exercise at a time (SPEC §4.2) -->
  <main id="workout" class="workout" hidden>
    <div class="topbar">
      <button type="button" id="quit" class="ghost small">Quitter</button>
      <strong id="w-name"></strong>
      <span id="chrono" class="chrono">0:00</span>
    </div>
    <div id="segments" class="segments"></div>

    <h2 id="ex-name"></h2>
    <p id="ex-info" class="muted"></p>
    <div id="sets"></div>

    <div class="nav">
      <button type="button" id="prev">Précédent</button>
      <button type="button" id="next" class="primary">Suivant</button>
    </div>
    <button type="button" id="abandon" class="ghost">Abandonner la séance</button>

    <div id="rest" class="rest" hidden>
      <span class="rest-label">Repos</span>
      <strong id="rest-time">1:30</strong>
      <button type="button" id="rest-minus">−15 s</button>
      <button type="button" id="rest-plus">+15 s</button>
      <button type="button" id="rest-skip">Passer</button>
    </div>
  </main>

  <!-- In-app dialog: never confirm()/alert(), they're blocked in some frames (SPEC §8) -->
  <dialog id="dialog">
    <div id="dialog-body"></div>
    <div id="dialog-actions" class="dialog-actions"></div>
  </dialog>

  <script src="workout.js"></script>
  <script src="app.js"></script>
</body>
</html>
